services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - .env.production
    environment:
      REHAB_DB_PATH: /data/rehab_integration.db
      REHAB_SEED_DEMO_DATA: "false"
    volumes:
      - ./data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${REHAB_HTTP_PORT:-8080}:8080"
    volumes:
      - ./secrets/htpasswd:/etc/nginx/.htpasswd:ro
    restart: unless-stopped
